<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300"><rect width="1100" height="300" rx="18" fill="#151716"/><text x="34" y="48" fill="#f0db36" font-family="Consolas,monospace" font-size="20">index.php · comments API</text><text x="34" y="96" fill="#8bd7bc" font-family="Consolas,monospace" font-size="18">$action = $_GET['action'] ?? 'list';</text><text x="34" y="134" fill="#d7e4db" font-family="Consolas,monospace" font-size="18">$comments = read_comments();</text><text x="34" y="172" fill="#ff9c8f" font-family="Consolas,monospace" font-size="18">if ($action === 'create') { save_comment($_POST); }</text><text x="34" y="210" fill="#d7e4db" font-family="Consolas,monospace" font-size="18">json_response($comments);</text><text x="34" y="248" fill="#8bd7bc" font-family="Consolas,monospace" font-size="18">// GET: list · POST: create / like / delete</text></svg>
